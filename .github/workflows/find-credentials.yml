name: Find Valid Credentials - Continuous Search

on:
  workflow_dispatch:
    inputs:
      max_time:
        description: 'الحد الأقصى للوقت بالدقائق لكل تشغيل'
        required: false
        default: '10'
  schedule:
    # يعمل كل 10 دقائق
    - cron: '*/10 * * * *'
  push:
    branches: [ main ]

jobs:
  find-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # حد أقصى إضافي للأمان
    
    steps:
    - name: 📥 استخراج الكود
      uses: actions/checkout@v4
    
    - name: 🔧 إعداد Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: 📥 تحميل التقدم السابق
      if: always()
      continue-on-error: true
      run: |
        # إنشاء مجلد للتقدم إذا لم يكن موجوداً
        mkdir -p progress_data
        
        # محاولة تحميل التقدم السابق من artifacts
        if [ -f "progress.json" ]; then
          echo "📂 تم العثور على ملف تقدم محلي"
          cp progress.json progress_data/
        fi
    
    - name: 🔍 تشغيل البحث الشامل
      run: |
        echo "🚀 بدء جولة جديدة من البحث..."
        echo "⏱️ الوقت: $(date)"
        node find-credentials.js
      timeout-minutes: ${{ github.event.inputs.max_time || 10 }}
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        MAX_TIME_MINUTES: ${{ github.event.inputs.max_time || 10 }}
    
    - name: 📤 حفظ النتائج والتقدم
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: search-results-${{ github.run_id }}
        path: |
          found-credentials-*.json
          found-credentials.json
          progress.json
        retention-days: 30
    
    - name: 💾 حفظ التقدم للمرة القادمة
      if: always()
      run: |
        # حفظ التقدم في المستودع
        if [ -f "progress.json" ]; then
          echo "💾 حفظ التقدم..."
          
          # إنشاء مجلد للتقدم
          mkdir -p progress_data
          
          # نسخ ملف التقدم
          cp progress.json progress_data/
          
          # تكوين git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # إضافة وحفظ التغييرات
          git add progress_data/
          git add found-credentials.json 2>/dev/null || true
          
          # التحقق من وجود تغييرات
          if git diff --cached --quiet; then
            echo "📝 لا توجد تغييرات للحفظ"
          else
            git commit -m "💾 حفظ التقدم تلقائياً - $(date)"
            git push
            echo "✅ تم حفظ التقدم"
          fi
        fi
    
    - name: 📋 عرض النتائج
      if: always()
      run: |
        echo "📊 ======== نتائج الجولة ========"
        if [ -f "found-credentials.json" ]; then
          echo "✅ تم العثور على بيانات اعتماد صالحة!"
          cat found-credentials.json
        else
          echo "❌ لم يتم العثور على بيانات اعتماد في هذه الجولة"
        fi
        
        if [ -f "progress.json" ]; then
          echo -e "\n📈 التقدم الحالي:"
          cat progress.json | head -20
        fi
