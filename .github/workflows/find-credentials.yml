name: Find Valid Credentials

on:
  workflow_dispatch:
    inputs:
      max_time:
        description: 'الحد الأقصى للوقت بالدقائق'
        required: false
        default: '10'
  schedule:
    # يمكنك تعديل الجدول الزمني حسب الحاجة
    - cron: '0 */6 * * *'  # كل 6 ساعات

jobs:
  find-credentials:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 استخراج الكود
      uses: actions/checkout@v4
    
    - name: 🔧 إعداد Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'  # استخدام إصدار أحدث
        # لا نستخدم cache لتجنب مشكلة package-lock.json
    
    - name: 📦 تثبيت الاعتماديات
      run: |
        npm install --no-package-lock
        npm install axios
    
    - name: 🔍 تشغيل البحث عن بيانات الاعتماد
      run: |
        echo "بدء البحث..."
        node find-credentials.js
      timeout-minutes: ${{ github.event.inputs.max_time || 10 }}
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    
    - name: 📤 حفظ النتائج
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: found-credentials
        path: |
          found-credentials-*.json
          found-credentials.json
        retention-days: 7
    
    - name: 📋 عرض النتائج
      if: always()
      run: |
        if [ -f "found-credentials.json" ]; then
          echo "📄 تم العثور على بيانات اعتماد صالحة!"
          cat found-credentials.json
        else
          echo "❌ لم يتم العثور على بيانات اعتماد صالحة في هذه الدورة."
        fi
